[package]
name = "zahidex-ipc"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Trasporto IPC di ZahideX: Unix socket, framing, SCM_RIGHTS e buffer memfd"

[dependencies]
zahidex-protocol = { path = "../zahidex-protocol" }
serde = { version = "1.0", features = ["derive"] }
postcard.workspace = true
thiserror.workspace = true
nix = { version = "0.30", features = ["socket", "mman", "fs", "uio"] }
memmap2 = "0.9"
